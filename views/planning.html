</head>
<body class="bg-gray-100 text-gray-900">

   <!-- Header -->
   <header class="w-full bg-white py-3 px-6 flex items-center justify-between shadow-md">
    <a href="../index.html">
        <img src="../assets/logos/logo-transparent-svg.svg" alt="logo" class="h-12 md:h-16">
    </a>

    <nav class="hidden md:flex flex-1 justify-center gap-10 text-lg font-bold">
        <a href="planning.html" class="hover:text-[#B9625D] transition">Planning</a>
        <a href="favoris.html" class="hover:text-[#B9625D] transition">Favoris</a>
        <a href="recette.html" class="hover:text-[#B9625D] transition">Recettes</a>
        <a href="course.html" class="hover:text-[#B9625D] transition">Courses</a>
    </nav>

    <a href="recette.html" class="hidden md:flex bg-orange-400 text-white px-4 py-2 rounded-xl hover:bg-orange-300 transition shadow-md items-center">
        <img src="../assets/logos/logo-meal.png" class="h-6 w-6 mr-2" alt="logo-meal">
        Voir toutes les recettes
    </a>
    
    <nav class="md:hidden flex flex-col items-center gap-3 mt-3 text-lg font-bold">
        <a href="#" class="hover:text-[#B9625D] transition">Planning</a>

        <a href="#" class="hover:text-[#B9625D] transition">Recettes</a>

</header>


    <main class="container mx-auto py-8 px-6">
        <h1 class="text-3xl font-bold text-center mb-6">Mon Planning des Repas</h1>

        <div class="text-center mb-6">
            <button id="exportPDF" class="bg-orange-500 text-white px-6 py-2 rounded-lg shadow-md hover:bg-orange-600 transition">Exporter en PDF</button>
        </div>

        <div id="planning" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="day bg-white shadow-lg rounded-lg p-6" data-day="Lundi"><h2 class="text-xl font-semibold">Lundi</h2><ul class="mt-2"></ul></div>
            <div class="day bg-white shadow-lg rounded-lg p-6" data-day="Mardi"><h2 class="text-xl font-semibold">Mardi</h2><ul class="mt-2"></ul></div>
            <div class="day bg-white shadow-lg rounded-lg p-6" data-day="Mercredi"><h2 class="text-xl font-semibold">Mercredi</h2><ul class="mt-2"></ul></div>
            <div class="day bg-white shadow-lg rounded-lg p-6" data-day="Jeudi"><h2 class="text-xl font-semibold">Jeudi</h2><ul class="mt-2"></ul></div>
            <div class="day bg-white shadow-lg rounded-lg p-6" data-day="Vendredi"><h2 class="text-xl font-semibold">Vendredi</h2><ul class="mt-2"></ul></div>
            <div class="day bg-white shadow-lg rounded-lg p-6" data-day="Samedi"><h2 class="text-xl font-semibold">Samedi</h2><ul class="mt-2"></ul></div>
            <div class="day bg-white shadow-lg rounded-lg p-6" data-day="Dimanche"><h2 class="text-xl font-semibold">Dimanche</h2><ul class="mt-2"></ul></div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="planning.js"></script> 
</body>
</html>
